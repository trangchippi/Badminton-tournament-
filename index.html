<style>
:root{--bg:#e8eee9;--ink:#14261f;--g:#256b55;--y:#f5d547;--r:#b83a2e;--mu:#5d7168;--w:#fff;--ln:#c4d3ca}
*{box-sizing:border-box}body{margin:0;font:15px/1.35 "Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
#app{max-width:1300px;margin:auto;padding:10px}
.tvm{overflow:hidden;background:#eaf1f6}.tvm #app{max-width:none;padding:0}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
button,select,input,textarea{font:inherit}
button{border:1px solid var(--g);background:var(--w);color:var(--g);padding:6px 11px;border-radius:6px;cursor:pointer}
button.on,button.g{background:var(--g);color:#fff}button.s{padding:2px 7px;font-size:13px}
input,textarea,select{border:1px solid var(--ln);border-radius:6px;padding:6px;background:#fff;color:var(--ink)}
textarea{width:100%;height:170px}input.t{font-weight:700;width:100%;margin-bottom:6px}
h3{margin:14px 0 6px;font-size:17px}.mu{color:var(--mu);font-size:13px}.warn{color:var(--r);font-size:13px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.card{background:var(--w);border:1px solid var(--ln);border-radius:8px;padding:10px;margin-bottom:8px}
.grid .card{margin:0}.card.live{border:2px solid var(--g);box-shadow:inset 0 5px 0 var(--y)}.card.off{opacity:.5}
.ct{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:4px}
.vs{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 0;font-weight:600}
.vs input{width:58px;text-align:center}.vs span{flex:1}
.row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.q{display:flex;gap:10px;align-items:center;background:var(--w);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.q.blk{background:#f4efe3}.q .n{font-weight:700;color:var(--g);width:20px}.f{flex:1}i{color:var(--mu)}
.br{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}.col{display:flex;flex-direction:column;justify-content:space-around;gap:6px;min-width:170px}
.bx{position:relative;background:var(--w);border:1px solid var(--ln);border-left:4px solid var(--ln);border-radius:6px;padding:4px 8px}
.bx.court{border-left-color:var(--y)}.bx.done{border-left-color:var(--g)}
.sd{display:flex;justify-content:space-between;gap:6px;padding:1px 0}.sd.win{font-weight:700;color:var(--g)}.sd.void{color:#9aa;text-decoration:line-through}.sd.hl{background:var(--y)}
.bx .e{position:absolute;right:3px;top:3px;padding:0 5px;font-size:12px;border-color:var(--ln)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.two{display:grid;grid-template-columns:2fr 1fr;gap:20px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
/* TV */
#fit{position:absolute;transform-origin:0 0;background:#f4f8fb;color:#1b2a38}
#fit .bn{position:absolute;top:0;left:0;height:84px;line-height:84px;color:#fff;font-size:40px;font-weight:800;text-align:center;letter-spacing:1px}
#fit .bn span{position:absolute;right:30px;font-size:30px}
#fit .ch{position:absolute;top:104px;height:44px;line-height:44px;text-align:center;font-weight:700;font-size:20px;border-radius:4px}
#fit .tb{position:absolute;height:78px;border:2px solid #1b2a38;border-radius:7px;font-size:15px;box-shadow:0 2px 5px rgba(0,0,0,.2)}#fit .tb .r+.r{border-top:2px solid #1b2a38}#fit .tb .r:first-of-type{border-radius:5px 5px 0 0}#fit .tb .r:last-of-type{border-radius:0 0 5px 5px}
#fit .tb .r{display:flex;justify-content:space-between;align-items:center;gap:6px;height:37px;line-height:18px;padding:0 6px;background:rgba(255,255,255,.6)}
#fit .tb .r span{overflow:hidden;min-width:0}#fit .tb .r span div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fit .tb .r.win{background:#fff;font-weight:700;color:#0b6b3a}#fit .tb .r.vd span{text-decoration:line-through;opacity:.5}
#fit .tb .r b{min-width:26px;text-align:right}#fit .tb.lv{outline:4px solid var(--y)}
#fit .qrc{position:absolute;display:flex;gap:22px;align-items:center;background:#fff;border:3px solid #0d47a1;border-radius:14px;padding:16px 20px;box-shadow:0 4px 14px rgba(0,0,0,.15)}#fit .qrc img{width:250px;height:250px;flex:none}#fit .qrc b{display:block;font-size:29px;line-height:1.15;color:#0d47a1;margin-bottom:10px}#fit .qrc span{font-size:20px;color:#5d7168}#fit .art{position:absolute;opacity:.5;mix-blend-mode:multiply;pointer-events:none}#fit .lvb{position:absolute;top:-17px;right:0;font-size:12px;font-style:normal;font-weight:700;background:var(--y);color:#1b2a38;padding:0 6px;border-radius:3px}
#fit .champ{position:absolute;text-align:center;border:3px solid #c62828;border-radius:8px;background:#fff;height:128px;font-size:40px;line-height:1.1;padding-top:6px}
#fit .champ div{background:#c62828;color:#fff;font-size:22px;font-weight:800;margin-top:2px}#fit .champ b{display:block;font-size:17px;padding:6px}
#fit .pn{position:absolute;font-size:12px;font-weight:800;letter-spacing:.5px}#fit .cl{position:absolute;text-align:center;font-weight:800;color:#b0145f;font-size:18px}
#fit .big{position:absolute;top:104px;left:0;width:1920px;padding:0 30px;font-size:24px}
#fit .big .grid{grid-template-columns:repeat(3,1fr);align-items:start;align-content:start}#fit .big .card{min-height:120px}
.tvc{position:fixed;right:8px;bottom:8px;display:flex;gap:4px;opacity:.3}.tvc:hover{opacity:1}
table{border-collapse:collapse;font-size:13px;background:#fff;width:100%}th,td{border:1px solid var(--ln);padding:4px 6px;text-align:left;vertical-align:top}th{background:#d3e6dc}tr.pl td{background:#fff6cf}td.wn{font-weight:700;color:#0b6b3a}
</style></head><body><div id="app"></div>
<script>
const SRC='<!doctype html>\n'+document.documentElement.outerHTML;
const BYE='BYE',WD='WITHDRAWN',KEY='bt-v2',SNAP=window.__SNAP__,RO=!!SNAP||location.hash.startsWith('#view'),TVV=location.hash==='#viewtv',TVW=location.hash==='#tv';
let S=SNAP;
if(!S&&!RO){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}}
if(!S)S={title:'Badminton Tournament',courts:[1,2,3,4,5,6,7,8,9].map(n=>({id:n,name:'Court '+n,open:n<=5,m:null})),
 cats:[{id:'M',name:"Men's Doubles",txt:''},{id:'X',name:'Mixed Doubles',txt:''},{id:'W',name:"Women's Doubles",txt:''}],M:[],rest:10,last:{},auto:false,tvz:1};
if(S.title==='Company Badminton Tournament')S.title='Badminton Tournament';
let undo=[],view=TVV?'tv':RO?'courts':TVW?'tv':'desk',tvI=0,tvP=false,q='',bc='all';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{if(!RO&&!TVW)try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const real=x=>!!x&&x!==BYE&&x!==WD,isVoid=x=>x===BYE||x===WD,nm=x=>x==null?'TBD':x;
const name=(m,s)=>m[s]!=null?m[s]:(m.ph&&m.ph[s])||'TBD';
const players=n=>real(n)?n.split(/\s*[\/&+]\s*/).map(s=>s.trim().toLowerCase()):[];
const get=id=>S.M.find(m=>m.id===id),catOf=id=>S.cats.find(c=>c.id===id),cname=m=>(catOf(m.cat)||{}).name||m.cat;
const cn=id=>(S.courts.find(c=>c.id===id)||{}).name;
const rname=t=>t===2?'Final':t===4?'Semi-final':t===8?'Quarter-final':'Round of '+t;
const rl=m=>m.pre?'Preliminary':m.bronze?'Bronze match':rname(2**(m.R-m.r));
function mut(f){undo.push(JSON.stringify(S));if(undo.length>40)undo.shift();f();settle();save();render()}
function doUndo(){if(!undo.length)return;S=JSON.parse(undo.pop());save();render()}

/* ---------- bracket logic ---------- */
function plan(n){let T=1;while(T*2<=n)T*=2;return{T,P:n-T}}
function build(){
 S.M=[];S.courts.forEach(c=>c.m=null);S.last={};
 S.cats.forEach(c=>{
  const p=c.txt.split('\n').map(s=>s.trim()).filter(Boolean);if(p.length<2)return;
  const{T,P}=plan(p.length),R=Math.log2(T);
  const mk=(id,r,i,o)=>{const m=Object.assign({id,cat:c.id,r,i,R,a:null,b:null,w:null,st:'wait'},o);S.M.push(m);return m};
  for(let r=0;r<R;r++)for(let i=0;i<T>>(r+1);i++){const o={};
   if(r<R-1)o.nx=[`${c.id}_${r+1}_${i>>1}`,i%2?'b':'a'];if(R>=2&&r===R-2)o.lx=[c.id+'_B',i%2?'b':'a'];
   mk(`${c.id}_${r}_${i}`,r,i,o)}
  if(R>=2)mk(c.id+'_B',R-1,1,{bronze:1});
  const ps=[];for(let s=T;s>=2;s-=2)ps.push(s);for(let s=T-1;s>=1;s-=2)ps.push(s);
  const pre=ps.slice(0,P).sort((x,y)=>x-y),isPre=new Set(pre);
  const R0=s=>[get(`${c.id}_0_${(s-1)>>1}`),(s-1)%2?'b':'a'];
  let e=0;for(let s=1;s<=T;s++)if(!isPre.has(s)){const[m,sd]=R0(s);m[sd]=p[e++]}
  pre.forEach((s,k)=>{const[m,sd]=R0(s);mk(`${c.id}_P_${k}`,-1,k,{pre:1,a:p[e],b:p[e+1],nx:[m.id,sd]});e+=2;m.ph=m.ph||{};m.ph[sd]='Winner prelim '+(k+1)})
 })}
function finish(m,w,sa,sb,wo){
 m.w=w;m.sa=sa;m.sb=sb;m.wo=wo||null;m.st='done';m.end=Date.now();
 m.ct=cn(m.court);const c=S.courts.find(c=>c.id===m.court);if(c)c.m=null;m.court=null;
 if(!wo)[...players(m.a),...players(m.b)].forEach(p=>S.last[p]=m.end);
 const l=w===m.a?m.b:m.a;if(m.nx)get(m.nx[0])[m.nx[1]]=w;if(m.lx)get(m.lx[0])[m.lx[1]]=l}
function settle(){let ch=true,g=0;
 while(ch&&g++<60){ch=false;for(const m of S.M){if(m.st==='done')continue;const a=m.a,b=m.b;let w=null;
  if(isVoid(a)&&isVoid(b))w=(a===WD||b===WD)?WD:BYE;else if(isVoid(a)&&real(b))w=b;else if(isVoid(b)&&real(a))w=a;
  if(w!==null){finish(m,w,null,null,'W/O');ch=true}}}
 if(S.auto)fill_()}

/* ---------- courts & queue ---------- */
const busy=()=>new Set(S.courts.flatMap(c=>c.m?players(get(c.m).a).concat(players(get(c.m).b)):[]));
const put=(m,c)=>{c.m=m.id;m.court=c.id;m.st='court';m.t=Date.now();m.hold=0};
function queue(){const b=busy(),now=Date.now();
 const key=m=>m.r*2+(m.r===m.R-1&&!m.bronze?1:0);
 return S.M.filter(m=>m.st==='wait'&&real(m.a)&&real(m.b)).sort((x,y)=>key(x)-key(y)||S.cats.findIndex(c=>c.id===x.cat)-S.cats.findIndex(c=>c.id===y.cat)||x.i-y.i).map(m=>{
  const ps=[...players(m.a),...players(m.b)];let why='';const on=ps.filter(p=>b.has(p));
  if(m.hold)why='held (sent back)';else if(on.length)why='a player is still on court';
  else{const r=ps.reduce((x,p)=>Math.max(x,S.last[p]?S.rest-(now-S.last[p])/60000:0),0);if(r>0)why='resting, '+Math.ceil(r)+' min left'}
  return{m,why}})}
function fill_(){S.courts.filter(c=>c.open&&!c.m).forEach(c=>{const x=queue().find(o=>!o.why);if(x)put(x.m,c)})}
const fillNow=()=>mut(fill_);
const asg=(id,cid)=>{if(cid)mut(()=>put(get(id),S.courts.find(c=>c.id==cid)))};
function res(id,side,cid){const m=get(id),w=side==='a'?m.a:m.b;
 const ga=document.getElementById('sa_'+id).value,gb=document.getElementById('sb_'+id).value;
 const sa=ga===''?null:+ga,sb=gb===''?null:+gb;
 if(sa!=null&&sb!=null){const ws=side==='a'?sa:sb,ls=side==='a'?sb:sa;
  if(ws<=ls)return alert('The winner must have more points than the other team.');
  if(ws>30)return alert('The game ends at 30 points.');
  if(ws<30&&!confirm('Winner has only '+ws+' points (game is to 30). Save anyway?'))return}
 if(!confirm(w+' won'+(sa!=null&&sb!=null?', '+sa+'-'+sb:'')+'?'))return;
 mut(()=>finish(m,w,sa,sb))}
const back=id=>mut(()=>{const m=get(id),c=S.courts.find(c=>c.id===m.court);if(c)c.m=null;m.court=null;m.st='wait';m.hold=1});
const addCourt=()=>mut(()=>{const n=Math.max(0,...S.courts.map(c=>c.id))+1;S.courts.push({id:n,name:'Court '+n,open:true,m:null})});
function renC(id){const c=S.courts.find(c=>c.id===id),n=prompt('Court name',c.name);if(n)mut(()=>c.name=n)}
function togC(id){const c=S.courts.find(c=>c.id===id);if(c.m)return alert('Finish or send the current match back first.');mut(()=>c.open=!c.open)}

/* ---------- changes ---------- */
function editM(id){const m=get(id),t=[m.nx,m.lx].filter(Boolean).map(x=>get(x[0]));
 if(t.some(x=>x.st==='done'||x.st==='court'))return alert('The next match is already started or finished. Fix that one first.');
 const a=prompt('Side A (type WITHDRAWN to void a side, blank for TBD):',m.a||'');if(a===null)return;
 const b=prompt('Side B:',m.b||'');if(b===null)return;
 mut(()=>{if(m.nx)get(m.nx[0])[m.nx[1]]=null;if(m.lx)get(m.lx[0])[m.lx[1]]=null;
  const c=S.courts.find(c=>c.id===m.court);if(c)c.m=null;
  m.court=null;m.w=null;m.wo=null;m.sa=m.sb=null;m.st='wait';m.a=a.trim()||null;m.b=b.trim()||null})}
function wd(){const t=(prompt('Who is withdrawing? Type a player name. Every unfinished match with them becomes a walkover.')||'').trim().toLowerCase();if(!t)return;
 const has=(m,s)=>real(m[s])&&m[s].toLowerCase().includes(t);
 const hit=S.M.filter(m=>m.st!=='done'&&(has(m,'a')||has(m,'b')));
 if(!hit.length)return alert('No unfinished match found for that name.');
 if(!confirm('This affects:\n'+hit.map(m=>cname(m)+' '+rl(m)+': '+nm(m.a)+' vs '+nm(m.b)).join('\n')))return;
 mut(()=>hit.forEach(m=>['a','b'].forEach(s=>{if(has(m,s))m[s]=WD})))}
function ren(){const o=prompt('Substitute: replace which name?');if(!o)return;const n=prompt('With:');if(n===null)return;
 if(S.M.some(m=>(m.st==='done'||m.st==='court')&&!m.wo&&[m.a,m.b].some(x=>real(x)&&x.includes(o)))&&!confirm('That team has already played. Substitution normally needs organizer approval. Continue?'))return;
 mut(()=>{S.M.forEach(m=>['a','b'].forEach(s=>{if(real(m[s]))m[s]=m[s].split(o).join(n)}));S.cats.forEach(c=>c.txt=c.txt.split(o).join(n))})}
function draw(){if(S.M.some(m=>m.st==='done'&&!m.wo)&&!confirm('This clears all results and rebuilds the brackets. Continue?'))return;mut(build);view='desk';render()}

/* ---------- files ---------- */
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
const backup=()=>dl('badminton-backup.json',JSON.stringify(S),'application/json');

const openTV=()=>window.open(location.href.split('#')[0]+'#tv','bttv','width=1280,height=720');

/* ---------- desk / phone views ---------- */
const matchLine=m=>`<b>${esc(cname(m))}</b>, ${rl(m)}`;
function courtsHTML(ro){return '<div class="grid">'+S.courts.filter(c=>!ro||c.open).map(c=>{const m=c.m&&get(c.m);

 if(!c.open)h+='<div class="mu">Closed</div>';else if(!m)h+='<div class="mu">Free</div>';
 else{h+=`<div class="mu">${matchLine(m)}, ${Math.round((Date.now()-m.t)/60000)} min</div>`;
  ['a','b'].forEach(s=>h+=`<div class="vs"><span>${esc(m[s])}</span>`+(ro?'':`<input type="number" min="0" max="30" id="s${s}_${m.id}" placeholder="pts"><button class="g s" onclick="res('${m.id}','${s}',${c.id})">Won</button>`)+'</div>');
  if(!ro)h+=`<div class="row"><button class="s" onclick="back('${m.id}')">Send back to queue</button></div>`}
 return h+'</div>'}).join('')+'</div>'}
function nextHTML(ro,n){const L=queue(),free=S.courts.filter(c=>c.open&&!c.m);
 return `<h3>Next up (${L.length} ready)</h3>`+(L.slice(0,n).map(({m,why},i)=>`<div class="q ${why?'blk':''}"><span class="n">${i+1}</span><div class="f"><div class="mu">${matchLine(m)}</div>${esc(m.a)} <i>vs</i> ${esc(m.b)}${why?`<div class="warn">${why}</div>`:''}</div>`+
  (ro||!free.length?'':`<select onchange="asg('${m.id}',this.value)"><option value="">Assign to…</option>${free.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>`)+'</div>').join('')||'<div class="mu">No match is ready yet.</div>')}
function box(m,ro){const hl=x=>q&&real(x)&&x.toLowerCase().includes(q.toLowerCase())?' hl':'';
 const sd=s=>{const x=m[s],sc=s==='a'?m.sa:m.sb;return `<div class="sd${m.st==='done'&&m.w===x?' win':''}${isVoid(x)?' void':''}${hl(x)}"><span>${esc(name(m,s))}</span>${sc!=null?`<b>${sc}</b>`:''}</div>`};
 return `<div class="bx ${m.st}"><div class="mu">${rl(m)}${m.st==='court'?', '+esc(cn(m.court)):''}${m.wo==='W/O'?', walkover':''}</div>${sd('a')}${sd('b')}${ro?'':`<button class="e" onclick="editM('${m.id}')">Edit</button>`}</div>`}
function bracketHTML(c,ro){const ms=S.M.filter(m=>m.cat===c.id);if(!ms.length)return'';const R=ms[0].R,lo=ms.some(m=>m.pre)?-1:0;let h=`<h3>${esc(c.name)}</h3><div class="br">`;
 for(let r=lo;r<R;r++)h+='<div class="col">'+ms.filter(m=>m.r===r&&!m.bronze).sort((a,b)=>a.i-b.i).map(m=>box(m,ro)).join('')+(r===R-1?ms.filter(m=>m.bronze).map(m=>box(m,ro)).join(''):'')+'</div>';
 return h+'</div>'}
function brHTML(ro){if(!S.M.length)return'<p class="mu">No brackets yet. Go to Setup.</p>';
 return `<div class="chips"><button class="${bc==='all'?'on':''}" onclick="bc='all';render()">All</button>`+S.cats.map(c=>`<button class="${bc===c.id?'on':''}" onclick="bc='${c.id}';render()">${esc(c.name)}</button>`).join('')+'</div>'+S.cats.filter(c=>bc==='all'||bc===c.id).map(c=>bracketHTML(c,ro)).join('')}
function findHTML(){const k=q.trim().toLowerCase();if(!k)return'<p class="mu">Type your name to see your matches.</p>';
 const L=S.M.filter(m=>[m.a,m.b].some(x=>real(x)&&x.toLowerCase().includes(k)));
 return L.map(m=>`<div class="q"><div class="f"><div class="mu">${matchLine(m)}</div>${esc(name(m,'a'))} <i>vs</i> ${esc(name(m,'b'))}<div class="mu">${m.st==='done'?'Finished'+(m.sa!=null?', '+m.sa+'-'+m.sb:m.wo?', walkover':''):m.st==='court'?'On '+esc(cn(m.court)):'Waiting'}</div></div></div>`).join('')||'<p class="mu">No match found.</p>'}
const cnt=v=>{const n=v.split('\n').filter(s=>s.trim()).length;if(n<2)return n+' pairs';const{T,P}=plan(n);return `${n} pairs: ${P?P+' preliminary match'+(P>1?'es':'')+', then ':''}${rname(T)}`};
function setupHTML(){return `<div class="card"><input class="t" value="${esc(S.title)}" onchange="S.title=this.value;save()"><label>Rest between a player's matches (minutes) <input type="number" min="0" style="width:70px" value="${S.rest}" onchange="S.rest=+this.value||0;save()"></label></div><p class="mu">Enter pairs in draw order, position 1 first. With an odd count, the last pairs in the list play the preliminary matches (for 17 pairs, positions 16 and 17).</p>`+
 S.cats.map((c,k)=>`<div class="card"><input class="t" value="${esc(c.name)}" onchange="S.cats[${k}].name=this.value;save()"><textarea placeholder="One pair per line, e.g.\nAlice Tan / Bob Lim" oninput="S.cats[${k}].txt=this.value;save();document.getElementById('cn${k}').textContent=cnt(this.value)">${esc(c.txt)}</textarea><div class="mu" id="cn${k}">${cnt(c.txt)}</div></div>`).join('')+
 `<div class="tools"><button onclick="mut(()=>S.cats.push({id:'c'+S.cats.length,name:'New category',txt:''}))">Add category</button><button class="g" onclick="draw()">Build brackets</button></div><p class="mu">Write "Name1 / Name2" so a player in two categories is never sent to two courts at once.</p>`}

const PAL=['#f7c6dc','#fbd2b6','#fdeaa8','#c8e8cf','#c6dff6','#dde3ea'],THEME=['#0d47a1','#c8102e','#e8590c','#00796b','#5b2a8c'];
const pl=x=>String(x==null?'':x).split(/\s*[\/&+]\s*/).map(t=>`<div>${esc(t)}</div>`).join('');
const SH='<svg viewBox="0 0 34 34" width="50" height="50" style="vertical-align:middle"><g stroke="#fff" stroke-width="2.2" fill="none"><path d="M3 9L8 3L15 1L22 2L28 5"/><path d="M26 26L3 9M26 26L8 3M26 26L15 1M26 26L22 2M26 26L28 5"/></g><circle cx="27" cy="27" r="6" fill="#fff"/></svg>';
const bnBg=t=>`background:linear-gradient(90deg,#0b1d3a,${t} 25%,${t} 75%,#0b1d3a)`,logo=()=>`<img src="${IMG.logo}" style="position:absolute;left:0;top:0;height:84px">`;
const fitHTML=o=>`<div id="fit" data-w="${o.W}" data-h="${o.H}" style="width:${o.W}px;height:${o.H}px">${o.h}</div>`;
function tvBox(m,x,y,w,d){const col=PAL[Math.min(d,5)];
 const row=s=>{const v=m[s],sc=s==='a'?m.sa:m.sb,win=m.st==='done'&&m.w===v&&real(v);
  return `<div class="r${win?' win':''}${isVoid(v)?' vd':''}"><span>${real(v)?pl(v):esc(name(m,s))}</span><b>${win&&m.wo==='W/O'?'W/O':sc!=null?sc:''}</b></div>`};
 return `<div class="tb${m.st==='court'?' lv':''}" style="left:${x}px;top:${y-39}px;width:${w}px;background:${col}">${m.st==='court'?`<i class="lvb">${esc(cn(m.court))}</i>`:''}${row('a')}${row('b')}</div>`}
const TOP=180,PT=112,CW=250,G=26,bw=r=>r===0?215:200;
function tvDims(cs,u){const L=[];cs.forEach(c=>{const ms=S.M.filter(m=>m.cat===c.id);if(!ms.length)return;const R=ms[0].R,hh=(R>=2?2**(R-2):1)*PT;let Lw=0;for(let r=0;r<R-1;r++)Lw+=bw(r)+G;
  L.push({hh,W0:48+2*Lw+CW,pre:ms.filter(m=>m.pre).length,bm:ms.some(m=>m.bronze)})});
 const W=Math.max(u?1920:900,...L.map(x=>x.W0)),FY=Math.max(TOP+410,...L.map(x=>TOP+x.hh/2)),cnt=Math.max(1,Math.floor((W-24)/(CW+24)));
 const mb=x=>Math.max(FY+x.hh/2+10,x.bm?FY+169:FY+60),y0=Math.max(0,...L.filter(x=>x.pre).map(mb))+30;
 const H=Math.max(u?1080:0,...L.map(x=>x.pre?y0+100+(Math.ceil(x.pre/cnt)-1)*104+39+30:mb(x)+30));
 return{W,H,FY,y0,cnt}}
function tvB(c,k,list,u){
 const ms=S.M.filter(m=>m.cat===c.id);if(!ms.length)return null;
 const D=tvDims(list||S.cats,u!==false),R=ms[0].R,pre=ms.filter(m=>m.pre).sort((a,b)=>a.i-b.i),n=c.txt.split('\n').filter(s=>s.trim()).length,th=THEME[k%THEME.length];
 const half0=R>=2?2**(R-2):1,hh=half0*PT;let Lw=0;for(let r=0;r<R-1;r++)Lw+=bw(r)+G;

 const xL=r=>{let x=PD;for(let q=0;q<r;q++)x+=bw(q)+G;return x},xR=r=>{let x=W-PD-bw(r);for(let q=0;q<r;q++)x-=bw(q)+G;return x};
 const el=(x1,y1,x2,y2)=>{const xm=(x1+x2)/2;return `M${x1} ${y1}H${xm}V${y2}H${x2}`};
 const hd=(x,w,t,col)=>`<div class="ch" style="left:${x}px;width:${w}px;background:${col}">${t}</div>`;
 let h='',p='';
 for(let r=0;r<R-1;r++){const d=R-1-r,t=rname(2**(R-r)),half=2**(R-2-r);h+=hd(xL(r),bw(r),t,PAL[Math.min(d,5)])+hd(xR(r),bw(r),t,PAL[Math.min(d,5)]);
  for(let j=0;j<half;j++)for(const s of[0,1]){const m=get(`${c.id}_${r}_${s*half+j}`),x=s?xR(r):xL(r),y=BT+(j+.5)*PT*2**r;
   h+=tvBox(m,x,y,bw(r),d);
   const last=r===R-2,x1=s?x:x+bw(r),x2=last?(s?cx+CW:cx):(s?xR(r+1)+bw(r+1):xL(r+1)),ty=last?FY:BT+((j>>1)+.5)*PT*2**(r+1);
   p+=el(x1,y,x2,ty)}}
 const fm=ms.find(m=>m.r===R-1&&!m.bronze&&!m.pre),bm=ms.find(m=>m.bronze);
 h+=hd(cx,CW,'FINAL',PAL[0])+tvBox(fm,cx,FY,CW,0);

 if(bm)h+=`<div class="cl" style="left:${cx}px;width:${CW}px;top:${FY+50}px;color:${th}">3RD PLACE MATCH</div>`+tvBox(bm,cx,FY+130,CW,1);

 if(IMG.art[k]){const zx=R>=2?xL(R-2):PD,zw=(R>=2?xR(R-2)+bw(R-2):W-PD)-zx,zy=TOP+4,zh=FY-190-zy,r=IMG.r[k],ah=Math.min(zh,zw*.96/r),aw=ah*r;
  art+=`<img class="art" src="${IMG.art[k]}" style="left:${zx+(zw-aw)/2}px;top:${zy+(zh-ah)/2}px;width:${aw}px;height:${ah}px">`}
 return{W,H,h:`${art}<svg width="${W}" height="${H}" style="position:absolute;left:0;top:0"><path d="${p}" stroke="#1b2a38" stroke-width="2" fill="none"/></svg><div class="bn" style="${bnBg(th)};width:${W}px">${logo()}${SH} ${esc(c.name).toUpperCase()} · ${n} TEAMS ${SH}</div>${h}`}}
const clock=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const tv0=D=>({W:D.W,H:D.H,h:`<img class="art" src="${IMG.wave}" style="left:0;top:${Math.max(0,D.H-D.W*.3335)}px;width:${D.W}px"><div class="bn" style="${bnBg('#0d47a1')};width:${D.W}px">${logo()}${SH} ${esc(S.title)} ${SH}<span>${clock()}</span></div><div class="big two" style="width:${D.W}px">${courtsHTML(1)}<div>${nextHTML(1,5)}</div></div><div class="qrc" style="right:30px;bottom:24px;width:${Math.round((D.W-80)/3)}px"><img src="${IMG.qr}"><div><b>SCAN TO VIEW THE TOURNAMENT DASHBOARD</b><span>Live courts, next matches, brackets and your own match</span></div></div>`});
function tvHTML(){const sl=[null,...S.cats.filter(c=>S.M.some(m=>m.cat===c.id))],i=tvI%sl.length,o=sl[i]?tvB(sl[i],S.cats.indexOf(sl[i])):tv0(tvDims(S.cats,true));
 return `${fitHTML(o)}<div class="tvc"><button onclick="tvS(-1)">◀</button><button onclick="tvP=!tvP;render()">${tvP?'Play':'Pause'}</button><button onclick="tvS(1)">▶</button><button onclick="tvZ(-.05)">−</button><button onclick="S.tvz=1;save();fitTV()">Fit ${Math.round((S.tvz||1)*100)}%</button><button onclick="tvZ(.05)">+</button>${TVW||TVV?'':'<button onclick="view=\'desk\';render()">Exit</button>'}</div>`}
function fitTV(){const f=$('#fit');if(!f)return;const W=+f.dataset.w,H=+f.dataset.h,k=Math.min(innerWidth/W,innerHeight/H)*(S.tvz||1);
 f.style.transform=`scale(${k})`;f.style.left=(innerWidth-W*k)/2+'px';f.style.top=Math.max(0,(innerHeight-H*k)/2)+'px'}
const tvS=d=>{tvI=Math.max(0,tvI+d);render()};
const tvZ=d=>{S.tvz=Math.round(Math.max(.4,Math.min(1.6,(S.tvz||1)+d))*100)/100;save();render()};

const fmtT=t=>t?new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'-';
const dur=m=>m.t&&m.end&&!m.wo?Math.round((m.end-m.t)/60000):'';
const logRows=()=>S.M.slice().sort((a,b)=>(a.t||1e15)-(b.t||1e15)||S.cats.findIndex(c=>c.id===a.cat)-S.cats.findIndex(c=>c.id===b.cat)||a.r-b.r||a.i-b.i);
const scoreT=m=>m.wo==='W/O'?'W/O':m.sa!=null&&m.sb!=null?m.sa+'-'+m.sb:'';
function logHTML(){const L=logRows(),ds=L.filter(m=>dur(m)!==''),avg=ds.length?Math.round(ds.reduce((x,m)=>x+dur(m),0)/ds.length):0;
 const tm=m=>m.t?fmtT(m.t)+(m.end&&!m.wo?' to '+fmtT(m.end)+' ('+dur(m)+' min)':''):'';
 const tn=(m,s)=>{const x=name(m,s),w=m.st==='done'&&m.w===x&&real(x);return `<td class="${w?'wn':''}">${w?'✓ ':''}${esc(x)}</td>`};
 return `<div class="tools"><b>${L.filter(m=>m.st==='done').length} of ${L.length} matches finished</b><span class="mu">average ${avg} min</span><button onclick="csv()">Export CSV</button><button onclick="doUndo()">Undo</button></div><table><tr><th style="width:10%">Match</th><th>Team A</th><th>Team B</th><th style="width:7%">Court</th><th style="width:14%">Time</th><th style="width:6%">Score</th><th style="width:8%">Status</th><th style="width:9%"></th></tr>`+
 L.map(m=>`<tr class="${m.st==='court'?'pl':''}"><td>${esc(cname(m))}<br><span class="mu">${rl(m)}</span></td>${tn(m,'a')}${tn(m,'b')}<td>${esc(m.st==='court'?cn(m.court):m.ct||'')}</td><td>${tm(m)}</td><td>${scoreT(m)}</td><td>${m.st==='done'?(m.wo?'Walkover':'Done'):m.st==='court'?'Playing':'Waiting'}</td><td>${m.st==='done'?`<button class="s" title="Change scores, winner, minutes" onclick="fixM('${m.id}')">Fix</button> `:''}<button class="s" title="Change the teams and reopen" onclick="editM('${m.id}')">Edit</button></td></tr>`).join('')+'</table><p class="mu">✓ marks the winner. Fix changes scores, winner and minutes played. Edit changes the two teams and reopens the match. The TV updates straight away.</p>'}
function fixM(id){const m=get(id);if(m.st!=='done')return;
 const sa=prompt('Score of '+m.a+' (blank = none):',m.sa==null?'':m.sa);if(sa===null)return;
 const sb=prompt('Score of '+m.b+':',m.sb==null?'':m.sb);if(sb===null)return;
 const wa=prompt('Winner? A = '+m.a+', B = '+m.b,m.w===m.b?'B':'A');if(wa===null)return;
 const w=wa.trim().toUpperCase()==='B'?m.b:m.a;
 const mins=prompt('Minutes played (blank = keep):',dur(m));if(mins===null)return;
 const t=[m.nx,m.lx].filter(Boolean).map(x=>get(x[0]));
 if(w!==m.w&&t.some(x=>x.st==='done'||x.st==='court'))return alert('The next match has already started or finished. Fix that one first.');
 mut(()=>{m.sa=sa===''?null:+sa;m.sb=sb===''?null:+sb;if(mins!==''&&m.end)m.t=m.end-(+mins)*60000;
  if(w!==m.w){const l=w===m.a?m.b:m.a;m.w=w;m.wo=null;if(m.nx)get(m.nx[0])[m.nx[1]]=w;if(m.lx)get(m.lx[0])[m.lx[1]]=l}})}
function csv(){const q2=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
 dl('badminton-log.csv',[['Category','Round','Team A','Team B','Court','Start','End','Minutes','Score A','Score B','Winner','Status'].map(q2).join(',')].concat(logRows().map(m=>[cname(m),rl(m),m.a,m.b,m.st==='court'?cn(m.court):m.ct,fmtT(m.t),fmtT(m.end),dur(m),m.sa,m.sb,m.st==='done'?m.w:'',m.st==='done'?(m.wo?'Walkover':'Done'):m.st==='court'?'Playing':'Waiting'].map(q2).join(','))).join('\n'),'text/csv')}
const pub=()=>dl('data.json',JSON.stringify({...S,ts:Date.now()}),'application/json');

function brTV(){const cs=S.cats.filter(c=>S.M.some(m=>m.cat===c.id));if(!cs.length)return'<p class="mu">No brackets yet.</p>';
 const c=cs.find(c=>c.id===bc)||cs[0],o=tvB(c,S.cats.indexOf(c),[c],false);
 return `<div class="chips">${cs.map(x=>`<button class="${x===c?'on':''}" onclick="bc='${x.id}';render()">${esc(x.name)}</button>`).join('')}</div><div id="pw" style="position:relative;overflow-x:auto;overflow-y:hidden">${fitHTML(o)}</div>`}
function fitView(){const f=$('#fit'),w=$('#pw');if(!f||!w)return;const W=+f.dataset.w,H=+f.dataset.h,k=Math.max(.5,Math.min(1,w.clientWidth/W));f.style.transform=`scale(${k})`;f.style.left='0';f.style.top='0';w.style.height=H*k+'px'}
async function pull(){try{const r=await fetch('data.json?t='+Date.now());if(!r.ok)return;const z=S.tvz;S=await r.json();if(TVV&&z!=null)S.tvz=z;if(view==='tv'||!document.activeElement.matches('input,textarea,select'))render()}catch(e){}}
function render(){const app=$('#app');document.body.className=view==='tv'?'tvm':'';
 if(view==='tv'){app.innerHTML=tvHTML();fitTV();return}
 const keep={};document.querySelectorAll('#app input[id^=s]').forEach(i=>keep[i.id]=i.value);
 const T=RO?[['courts','Courts'],['next','Next up'],['br','Brackets'],['tvb','Bracket (TV style)'],['find','Find me']]:[['desk','Desk'],['br','Brackets'],['tvb','Bracket (TV style)'],['log','Data log'],['setup','Setup']];
 let h='<nav>'+T.map(t=>`<button class="${view===t[0]?'on':''}" onclick="view='${t[0]}';render()">${t[1]}</button>`).join('')+(RO?'':`<button onclick="openTV()">TV in new window</button><button onclick="view='tv';tvI=0;render();(document.documentElement.requestFullscreen||(()=>0)).call(document.documentElement)">TV in this window</button>`)+'</nav>';
 if(RO&&S.ts)h+=`<div class="mu">Updated ${new Date(S.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}. This page refreshes itself.</div>`;
 h+=({desk:deskHTML,setup:setupHTML,tvb:brTV,log:logHTML,courts:()=>courtsHTML(1),next:()=>nextHTML(1,20),br:()=>brHTML(RO),find:()=>`<input placeholder="Your name" value="${esc(q)}" oninput="q=this.value;document.getElementById('res').innerHTML=findHTML()"><div id="res">${findHTML()}</div>`})[view]();
 app.innerHTML=h;fitView();for(const id in keep){const i=document.getElementById(id);if(i)i.value=keep[id]}}
document.onkeydown=e=>{if(view!=='tv')return;if(e.key==='Escape'&&!TVW&&!TVV){view=RO?'courts':'desk';render()}if(e.key==='ArrowRight')tvS(1);if(e.key==='ArrowLeft')tvS(-1)};
onresize=()=>{fitTV();fitView()};
addEventListener('storage',e=>{if(TVW&&e.key===KEY&&e.newValue){S=JSON.parse(e.newValue);render()}});
setInterval(()=>{if(TVW)try{S=JSON.parse(localStorage.getItem(KEY))||S}catch(e){}
 if(view==='tv'){if(!tvP)tvI++;render()}else if(view!=='setup'&&!document.activeElement.matches('input,textarea,select'))render()},12000);
if(RO&&!SNAP){pull();setInterval(pull,30000)}
render();
</script></body></html>
